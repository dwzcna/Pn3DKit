# 插件构建与发布使用同一入口；CAD 运行时及 Autodesk SDK 不进入发布资产。
name: Pn3DKit

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test, build and package
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build SDK and .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'

      - name: Check source version and tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (dotnet msbuild Pn3DKit/Pn3DKit.csproj -nologo -getProperty:Version).Trim()
          if ($LASTEXITCODE -or $version -notmatch '^\d+\.\d+\.\d+$') { throw '无法读取源码版本。' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw '标签与源码版本不一致，拒绝发布。'
          }

      - name: Run offline tests in Debug and Release
        shell: pwsh
        run: ./build/Test.ps1

      - name: Cache original Autodesk SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Pn3DKitSdk
          key: Plant2026-${{ runner.os }}-${{ hashFiles('build/PlantSdk.json') }}

      - name: Download and verify SDK references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = ./build/Get-PlantSdk.ps1 -RootDirectory "$env:RUNNER_TEMP/Pn3DKitSdk"
          "AutoCadManagedRoot=$($sdk.AutoCadManagedRoot)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PlantManagedRoot=$($sdk.PlantManagedRoot)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify plugin in Debug and Release
        shell: pwsh
        run: ./build/Build-Pn3DKit.ps1 -AutoCadManagedRoot $env:AutoCadManagedRoot -PlantManagedRoot $env:PlantManagedRoot -BuildOutputRoot artifacts/plugin-build/ci

      - name: Package Release plugin
        shell: pwsh
        run: ./build/Publish.ps1 -NoBuild

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: Pn3DKit-release
          path: artifacts/release/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pn3DKit-tests
          path: artifacts/TestResults/
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@v4
        with:
          name: Pn3DKit-release
          path: release

      - name: Publish version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          # 只上传三件正式资产，说明通过文件传入，避免转义或混入 SDK。
          gh release create $env:RELEASE_TAG --verify-tag --title "Pn3DKit $version" --notes-file release/release-notes.md release/Pn3DKit.dll "release/Pn3DKit-$version-AutoCAD2026-x64.zip" release/SHA256SUMS
          if ($LASTEXITCODE) { throw 'GitHub Release 发布失败。' }
